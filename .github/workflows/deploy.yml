name: Deploy PharmaPulse to S3

on:
  push:
    branches: [ main, staging ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build project
        run: npm run build
        env:
          CI: false
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
          
      - name: Deploy to S3
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            BUCKET="pharmapulse-frontend"
            echo "🚀 Deploying to PRODUCTION: $BUCKET"
          else
            BUCKET="pharmapulse-frontend-staging"
            echo "🧪 Deploying to STAGING: $BUCKET"
          fi
          
          aws s3 sync dist/ s3://$BUCKET --delete
          
      - name: Print deployment URL
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "✅ Production site: http://pharmapulse-frontend.s3-website-us-east-1.amazonaws.com"
          else
            echo "✅ Staging site: http://pharmapulse-frontend-staging.s3-website-us-east-1.amazonaws.com"
          fi